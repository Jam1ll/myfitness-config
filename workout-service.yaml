server:
  port: 8080

spring:
  application:
    name: workout-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/myfitness_workout}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:MyFitness_Db_2026_Secure#}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

resilience4j:
  circuitbreaker:
    instances:
      catalogCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        ignoreExceptions:
          - java.lang.IllegalArgumentException
          - com.myfitness.workout_service.exception.ResourceNotFoundException

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: true
        endpoint: http://zipkin:9411/api/v2/spans
